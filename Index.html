<div id="card"><h3 id="ct"></h3><p id="cp"></p></div><div id="dots"></div><div id="hint">Arrastra para mirar · Toca el suelo para caminar</div>

<div id="intro"><div><h1>🌸 Jardín Móvil</h1><p>Un jardín que viaja hasta ti, sin salir de la habitación. Arrastra para mirar, toca el suelo para caminar, o deja que el jardín te guíe.</p><button id="go" class="p">Entrar al jardín</button></div></div>
